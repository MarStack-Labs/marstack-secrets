name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Refuse a tag that is not on main
        run: |
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "${GITHUB_REF_NAME} points at a commit that is not on main"
            exit 1
          fi

      - run: go vet ./...
      - run: sh scripts/check-architecture.sh
      - run: go test -race ./...

      - name: Refuse a tag the changelog does not record
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Build the release archives
        run: make dist VERSION="${GITHUB_REF_NAME}"

      - name: Prove the binary reports the tag it was built from
        run: |
          tar -xzf dist/marsec_${GITHUB_REF_NAME}_linux_amd64.tar.gz -C /tmp marsec
          reported=$(/tmp/marsec version)
          if [ "$reported" != "${GITHUB_REF_NAME}" ]; then
            echo "the binary reports $reported, not ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          echo "notes=--notes-file notes.md" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            $notes \
            dist/*.tar.gz dist/SHA256SUMS
