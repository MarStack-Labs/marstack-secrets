minimumLimaVersion: 2.0.0

base:
- template:_images/ubuntu-24.04

vmType: vz
cpus: 2
memory: 2GiB
disk: 20GiB

mountType: virtiofs
mounts:
- location: "~/Documents/Portfolio/marstack-secrets"
  writable: true

ssh:
  loadDotSSHPubKeys: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -euo pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update -qq
    apt-get install -y -qq --no-install-recommends \
      ca-certificates curl git make jq \
      gcc libc6-dev \
      libcap2-bin util-linux procps

- mode: system
  script: |
    #!/bin/bash
    set -euo pipefail
    GO_VERSION=1.26.6
    ARCH=$(dpkg --print-architecture)
    if [ -x /usr/local/go/bin/go ] && /usr/local/go/bin/go version | grep -q "go${GO_VERSION}"; then
      exit 0
    fi
    curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${ARCH}.tar.gz" -o /tmp/go.tar.gz
    rm -rf /usr/local/go
    tar -C /usr/local -xzf /tmp/go.tar.gz
    rm -f /tmp/go.tar.gz
    printf 'export PATH=$PATH:/usr/local/go/bin\n' > /etc/profile.d/go.sh
    chmod 0644 /etc/profile.d/go.sh

- mode: system
  script: |
    #!/bin/bash
    set -euo pipefail
    GITLEAKS_VERSION=8.30.1
    if command -v gitleaks >/dev/null 2>&1; then
      exit 0
    fi
    case "$(dpkg --print-architecture)" in
      arm64) SUFFIX=linux_arm64 ;;
      amd64) SUFFIX=linux_x64 ;;
      *) echo "unsupported architecture" >&2; exit 1 ;;
    esac
    curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${SUFFIX}.tar.gz" -o /tmp/gitleaks.tar.gz
    tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks
    install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
    rm -f /tmp/gitleaks /tmp/gitleaks.tar.gz

- mode: system
  script: |
    #!/bin/bash
    set -euo pipefail
    swapoff -a || true
    sed -i '/\sswap\s/d' /etc/fstab
    sysctl -w vm.swappiness=0 >/dev/null
    printf 'vm.swappiness=0\n' > /etc/sysctl.d/99-marsec.conf

probes:
- description: go and gitleaks are installed
  script: |
    #!/bin/bash
    set -euo pipefail
    timeout 600 bash -c 'until [ -x /usr/local/go/bin/go ]; do sleep 3; done'
    timeout 600 bash -c 'until command -v gitleaks >/dev/null 2>&1; do sleep 3; done'
  hint: go or gitleaks provisioning did not finish
